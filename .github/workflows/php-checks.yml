name: PHP checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax and repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, gd, mbstring, zip
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './.git/*' \
            -print0 | xargs -0 -r -n1 php -l

      - name: Check patch whitespace
        run: git diff --check
